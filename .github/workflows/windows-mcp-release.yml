name: MCP Packages

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            asset: windows-x64
            outputType: WinExe
            archive: zip
            file: SymphonyRecomp-mcp-v0.2.0-windows-x64.zip
          - rid: linux-x64
            asset: linux-x64
            outputType: Exe
            archive: tar
            file: SymphonyRecomp-mcp-v0.2.0-linux-x64.tar.gz
    steps:
      - name: Checkout SymphonyRecomp
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download public v0.4.3b generated source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 31293910781 --repo BlackLabelHQ/SymphonyRecomp --name generated-source --dir generated

      - name: Apply automation-aware generated entry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("generated/Entry.cs")
          text = path.read_text()
          old = "        RecompOne.Runtime.Runtime.WaitForValidDisc();\n        using var fs = CueFs.Open(cuePath ?? RecompOne.Runtime.Runtime.CdPath);"
          new = "        var activeCuePath = RecompOne.Runtime.Runtime.WaitForValidDisc(cuePath);\n        using var fs = CueFs.Open(activeCuePath);"
          if old not in text:
              raise SystemExit("generated Entry.cs did not match v0.4.3b")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Test automation components
        run: dotnet test tools/SymphonyRecomp.Automation.Tests/SymphonyRecomp.Automation.Tests.csproj -c Release

      - name: Publish game
        run: >
          dotnet publish RecompOne.SoTN.csproj -c Release
          -r ${{ matrix.rid }}
          --self-contained false
          -m:1
          -p:UseSharedCompilation=false
          -p:PublishSingleFile=false
          -p:PublishReadyToRun=false
          -p:OutputType=${{ matrix.outputType }}
          -p:UseRidGraph=true
          -p:InformationalVersion=mcp-v0.2.0
          -p:NoWarn=0162
          -o package

      - name: Publish MCP companion
        run: >
          dotnet publish tools/SymphonyRecomp.Mcp/SymphonyRecomp.Mcp.csproj -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishReadyToRun=false
          -p:UseRidGraph=true
          -o package/mcp

      - name: Bundle documentation and mods
        run: |
          cp docs/mcp-automation.md package/MCP-AUTOMATION.md
          cp tools/SymphonyRecomp.Mcp/opencode.example.json package/mcp/opencode.example.json
          cp tools/SymphonyRecomp.Mcp/opencode.remote.example.json package/mcp/opencode.remote.example.json
          if [ -d mods ]; then
            rsync -a --exclude '.git*' --exclude '.cache' mods/ package/mods/
          fi

      - name: Bundle Linux launcher
        if: matrix.rid == 'linux-x64'
        run: |
          cp run.sh package/run.sh
          chmod +x package/run.sh package/sotn package/mcp/SymphonyRecomp.Mcp

      - name: Create ZIP archive
        if: matrix.archive == 'zip'
        run: cd package && zip -r ../SymphonyRecomp-mcp-v0.2.0-windows-x64.zip .

      - name: Create tar archive
        if: matrix.archive == 'tar'
        run: tar -czf SymphonyRecomp-mcp-v0.2.0-linux-x64.tar.gz -C package .

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: SymphonyRecomp-mcp-v0.2.0-${{ matrix.asset }}
          path: ${{ matrix.file }}
